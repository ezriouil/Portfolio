name: portfolio
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # STATE MANAGEMENT + DI + NAVIGATION BETWEEN SCREENS + MULTIPLE LANGUAGES
  get: ^4.6.6

  # FIREBASE
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0

  # IMAGES + CAMERA
  image_picker: ^1.0.0
  cached_network_image: ^3.4.0
  flutter_image_compress: ^2.0.0

  # UTILS
  cloudinary: ^1.2.0
  url_launcher: ^6.3.0
  #avatar_glow: ^3.0.1
  #flutter_launcher_icons: ^0.13.1
  #permission_handler: ^11.3.0
  #device_info_plus: ^10.0.1
  mailer: ^6.1.1
  #http: ^1.2.0
  #connectivity_plus: ^5.0.2
  #iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

#flutter_icons:
#  image_path_android: "assets/images/logo.webp"
#  android: true

flutter:

  uses-material-design: true

  assets:
#    - assets/images/


  fonts:
    - family: Poppins_light
      fonts:
        - asset: assets/font/poppins_light.ttf

    - family: Poppins_regular
      fonts:
        - asset: assets/font/poppins_regular.ttf

    - family: Poppins_bold
