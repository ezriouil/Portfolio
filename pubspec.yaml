name: portfolio
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # STATE MANAGEMENT + DI + NAVIGATION BETWEEN SCREENS + MULTIPLE LANGUAGES
  get: ^4.6.6

  # FIREBASE
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0

  # UTILS
  url_launcher: ^6.3.0
  avatar_glow: ^3.0.1
  mailer: ^6.1.1
  widget_and_text_animator: ^1.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

#flutter_icons:
#  image_path_android: "assets/images/logo.webp"
#  android: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/db/
    - assets/icons/design/
    - assets/icons/editors/
    - assets/icons/mobile/
    - assets/icons/stores/
    - assets/icons/web/


  fonts:

    - family: Manrope-Bold
      fonts:
        - asset: assets/font/Manrope-Bold.ttf

    - family: Manrope-Medium
      fonts:
        - asset: assets/font/Manrope-Medium.ttf

    - family: Recoleta-Medium
      fonts:
        - asset: assets/font/Recoleta-Medium.otf

    - family: Recoleta-Bold
      fonts:
        - asset: assets/font/Recoleta-Bold.otf

