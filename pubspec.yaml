name: portfolio
description: "Mohamed Ezriouil's responsive Flutter web portfolio."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # STATE MANAGEMENT + DI + NAVIGATION BETWEEN SCREENS + MULTIPLE LANGUAGES
  get: ^4.7.3

  # FIREBASE
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_analytics: ^13.0.1
  firebase_remote_config: ^7.0.1

  # UTILS
  http: ^1.6.0
  flutter_card_swiper: ^7.2.0
  url_launcher: ^6.3.2
  avatar_glow: ^3.0.1
  widget_and_text_animator: ^1.1.5
  mouse_follower: ^1.4.3
  parallax_rain: ^1.1.2
  timeline_tile: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/db/
    - assets/icons/design/
    - assets/icons/editors/
    - assets/icons/mobile/
    - assets/icons/stores/
    - assets/icons/web/
    - assets/icons/contact/


  fonts:

    - family: Manrope-Bold
      fonts:
        - asset: assets/font/Manrope-Bold.ttf

    - family: Manrope-Medium
      fonts:
        - asset: assets/font/Manrope-Medium.ttf

    - family: Recoleta-Medium
      fonts:
        - asset: assets/font/Recoleta-Medium.otf

    - family: Recoleta-Bold
      fonts:
        - asset: assets/font/Recoleta-Bold.otf

