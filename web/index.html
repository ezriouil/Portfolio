  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF; /* خلفية بيضاء */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }

    /* Splash overlay */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF; /* خلفية بيضاء */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    /* Animated wave loader */
    .wave {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 30px;
    }

    .bar {
      width: 6px;
      background: #000000; /* لون الحركة أسود */
      border-radius: 3px;
      animation: wave 1s infinite;
    }

    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes wave {
      0%, 40%, 100% { height: 8px; opacity: 0.3; }
      20% { height: 30px; opacity: 1; }
    }
  </style>
</head>
<body>
<div id="splash">
  <div class="wave">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>

<!-- Flutter Web Bootstrap -->
<script src="flutter_bootstrap.js" async></script>

<!-- Firebase SDK -->
<script defer src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script defer src="/__/firebase/10.7.1/firebase-firestore-compat.js"></script>
<script defer src="/__/firebase/init.js"></script>

<script>
  setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash) {
      splash.style.transition = 'opacity 0.5s';
      splash.style.opacity = '0';
      setTimeout(() => splash.remove(), 500);
    }
  }, 3000);
</script>
</body>
