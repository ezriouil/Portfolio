<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohamed Ezriouil</title>

  <style>
    /* Reset */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #292C2F; /* اللون الأساسي */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }

    /* Splash overlay */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #292C2F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    /* Animated loader (glow circles) */
    .circle {
      width: 20px;
      height: 20px;
      margin: 10px;
      border-radius: 50%;
      background: linear-gradient(45deg, #FFA500, #FFD700);
      box-shadow: 0 0 20px #FFA500, 0 0 40px #FFD700;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .circle:nth-child(2) {
      animation-delay: 0.2s;
    }

    .circle:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Loading text */
    #splash p {
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      margin-top: 30px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<!-- Splash Screen -->
<div id="splash">
  <div style="display:flex;">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
  <p>Loading</p>
</div>

<!-- Flutter Web Bootstrap -->
<script src="flutter_bootstrap.js" async></script>

<!-- Firebase SDK -->
<script defer src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script defer src="/__/firebase/10.7.1/firebase-firestore-compat.js"></script>
<script defer src="/__/firebase/init.js"></script>

<script>
  setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash) {
      splash.style.transition = 'opacity 0.5s';
      splash.style.opacity = '0';
      setTimeout(() => splash.remove(), 500);
    }
  }, 5000);
</script>
</body>
</html>
